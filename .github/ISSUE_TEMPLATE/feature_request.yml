name: Feature request
description: Suggest an improvement to ailiaili.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and what currently makes it difficult.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would help?
      description: Describe the desired behavior and any platforms it applies to.
    validations:
      required: true
