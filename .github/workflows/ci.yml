name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM tests & desktop compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test shared modules
        run: >
          ./gradlew
          :core:model:jvmTest
          :core:network:jvmTest
          :core:data:jvmTest
          :core:player:jvmTest
          :feature:player:jvmTest
          :app:jvmTest
          :desktopApp:compileKotlin
          --no-daemon --max-workers=2

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - name: Assemble debug
        run: ./gradlew :androidApp:assembleDebug --no-daemon --max-workers=2
