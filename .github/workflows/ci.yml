name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: JVM tests & desktop compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test shared modules
        run: >
          ./gradlew
          :core:model:jvmTest
          :core:network:jvmTest
          :core:data:jvmTest
          :core:designsystem:jvmTest
          :core:player:jvmTest
          :feature:player:jvmTest
          :app:jvmTest
          :desktopApp:compileKotlin
          --no-daemon --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-results
          path: '**/build/test-results/jvmTest/*.xml'
          retention-days: 14

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"
      - name: Assemble debug
        run: ./gradlew :androidApp:assembleDebug --no-daemon --max-workers=2
      - name: Verify APK (sha256 + package/version)
        run: |
          APK=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee SHA256SUMS
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -1)
          "$AAPT" dump badging "$APK" > badging.txt
          cat badging.txt | head -2
          grep -q "package: name='app.ailiaili'" badging.txt
          grep -q "versionName=" badging.txt
      - name: Upload APK + evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            androidApp/build/outputs/apk/debug/androidApp-debug.apk
            SHA256SUMS
            badging.txt
          retention-days: 14
