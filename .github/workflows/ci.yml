name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: JVM tests & desktop compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check repository documentation
        run: python3 .github/scripts/check_docs.py
      - name: Test shared modules
        run: ./gradlew verifyJvm --no-daemon --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-results
          path: '**/build/test-results/jvmTest/*.xml'
          retention-days: 14

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_BUILD_TOOLS: "37.0.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;${{ env.ANDROID_BUILD_TOOLS }}"
      - name: Assemble debug
        run: ./gradlew :androidApp:assembleDebug --no-daemon --max-workers=2
      - name: Verify APK (sha256 + package/version)
        run: |
          APK=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee SHA256SUMS
          AAPT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt2"
          VERSION_NAME=$(sed -n 's/^appVersion=//p' gradle.properties)
          VERSION_CODE=$(sed -n 's/^appVersionCode=//p' gradle.properties)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          "$AAPT" dump badging "$APK" > badging.txt
          head -2 badging.txt
          grep -Fq "package: name='app.ailiaili' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" badging.txt
      - name: Upload APK + evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            androidApp/build/outputs/apk/debug/androidApp-debug.apk
            SHA256SUMS
            badging.txt
          retention-days: 14
